[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keycard-ssh"
version = "0.1.3"
description = "Disposable SSH sandboxes. One command, zero setup."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sam Truss" }]
keywords = ["ssh", "sandbox", "ephemeral", "container", "docker", "devtools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "asyncssh>=2.24.0",
  "docker>=7.2",
  "click>=8.4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16.1",
  "mypy>=2.3",
  "pytest-timeout>=2.4.0",
]

[project.scripts]
keycard = "keycard.cli:main"

[project.urls]
Homepage = "https://github.com/SamTruss/keycard"
Issues = "https://github.com/SamTruss/keycard/issues"
Changelog = "https://github.com/SamTruss/keycard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/keycard"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung test should fail, not hold a CI runner until the job's own limit
# kills it an hour later with no useful output. Well above what the slowest
# test here needs, including a cold container pull.
timeout = 120
