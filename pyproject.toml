[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keycard"
version = "0.0.1"
description = "Disposable SSH sandboxes. One command, zero setup."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sam Truss" }]
keywords = ["ssh", "sandbox", "ephemeral", "container", "docker", "devtools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "asyncssh>=2.14",
  "docker>=7.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
keycard = "keycard.cli:main"

[project.urls]
Homepage = "https://github.com/SamTruss/keycard"
Issues = "https://github.com/SamTruss/keycard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/keycard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S104"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
