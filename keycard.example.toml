# keycard configuration
#
# This file is entirely optional — keycard runs with sensible defaults.
# Copy to ~/.config/keycard/keycard.toml to customise.

# Address and port to listen on. Port 22 is normally taken by the system
# sshd; overriding it will lock you out of your own host.
listen = ":2222"

# Public keys permitted to connect. Same format as OpenSSH authorized_keys.
authorized_keys = "~/.config/keycard/authorized_keys"

# Destroy a room after this long with no activity. Catches orphans left
# behind by dropped connections.
idle_timeout = "15m"

# On shutdown (SIGINT/SIGTERM), how long to let connected sessions finish on
# their own before they're cut off and their rooms destroyed. "0" cuts
# everyone off immediately, like `docker stop -t 0`.
shutdown_grace = "30s"

# If a connection drops mid-session (not a typed `exit`), pause the room
# instead of destroying it, and give the same username this long to
# reconnect and pick up right where they left off. "0" (the default) turns
# this off — a dropped connection is destroyed immediately, as in v1.
# Also settable per-run with `keycard up --keep 10m`.
keep_window = "0"

# What opens a room by default: "docker" (v1, the only one that has ever
# been shipped) or "firecracker" (v2 — see FIRECRACKER.md; written, but no
# microVM has booted yet, and it needs a host with /dev/kvm). Individual
# rooms can override this, so a mixed deployment is fine.
backend = "docker"

# Only read if something actually selects the firecracker backend, so a
# Docker-only setup can ignore this whole table.
#
# [firecracker]
# # An uncompressed vmlinux, not a distro bzImage — Firecracker boots ELF
# # kernels directly, with no bootloader. Required; there is no default.
# kernel = "/var/lib/keycard/vmlinux"
# # Where `sudo rootfs/build.sh --room NAME` put its output. A room called
# # "python" boots <rootfs_dir>/python.ext4 unless it names its own.
# rootfs_dir = "/var/lib/keycard/rootfs"
# # Per-microVM scratch: sockets, the room's rootfs copy, any snapshot, and
# # the guest console log. Defaults to a "keycard" directory under $TMPDIR.
# runtime_dir = "/run/keycard"
# # How long a room may take to answer after the VM starts. Covers kernel
# # boot and the rootfs init, so a slow first boot is not a failed one.
# boot_timeout = "30s"

# Rooms. Each key here becomes a valid SSH username:
#   ssh -p 2222 python@yourhost

[rooms.default]
image = "ubuntu:24.04"

[rooms.python]
image = "python:3.12-slim"
memory = "1g"
cpus = 2

[rooms.node]
image = "node:22-slim"
memory = "1g"

[rooms.offline]
# No outbound network. Good for running something you don't fully trust
# — though see SECURITY.md on what v1 does and does not protect against.
image = "ubuntu:24.04"
network = "none"

# [rooms.vm]
# # One room on the other backend. `image` still names the Docker image the
# # rootfs was derived from, so keycard.toml stays the single definition of
# # what a room is — rootfs/build.sh resolves it through this same config.
# image = "ubuntu:24.04"
# backend = "firecracker"
# memory = "1g"
# cpus = 2
# # Optional; defaults to <rootfs_dir>/vm.ext4.
# rootfs = "/var/lib/keycard/rootfs/ubuntu.ext4"
